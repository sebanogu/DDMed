# This workflow builds the Angular application and deploys it to GitHub Pages
name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Inject GA measurement ID (main repo only)
      env:
        GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      working-directory: ./frontend
      run: |
        if [ -n "$GA_MEASUREMENT_ID" ]; then
          perl -pi -e "s/__GA_MEASUREMENT_ID__/$GA_MEASUREMENT_ID/g" src/index.html
        fi
      
    - name: Build Angular application
      working-directory: ./frontend
      run: npm run build -- --base-href /DDMed/
      
    - name: Setup Pages
      uses: actions/configure-pages@v6
      with:
        enablement: true
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: './frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
