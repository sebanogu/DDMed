<section class="auth-page">
  <mat-card class="auth-card">
    <div class="eyebrow">Tenant-Aware Authentication</div>
    <h1>Sign in</h1>
    <p class="auth-copy">
      This demo session model supports multiple tenants and multiple roles per user.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" autocomplete="username">
        <mat-error *ngIf="form.controls.email.invalid && form.controls.email.touched">
          Enter a valid email address.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" autocomplete="current-password">
        <mat-error *ngIf="form.controls.password.invalid && form.controls.password.touched">
          Password is required.
        </mat-error>
      </mat-form-field>

      <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button mat-flat-button color="primary" type="submit" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
  </mat-card>

  <mat-card class="demo-card">
    <h2>Demo accounts</h2>
    <p>Use one of these users to exercise multi-role RBAC and tenant switching.</p>

    <div class="demo-users">
      <button
        *ngFor="let demoUser of demoUsers"
        mat-stroked-button
        type="button"
        color="primary"
        (click)="fillDemoUser(demoUser.email, demoUser.password)">
        <span>{{ demoUser.email }}</span>
        <small>{{ demoUser.label }}</small>
      </button>
    </div>
  </mat-card>
</section>
