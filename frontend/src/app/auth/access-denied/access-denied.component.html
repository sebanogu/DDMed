<section class="state-page" data-testid="auth-access-denied-page">
  <mat-card data-testid="auth-access-denied-card">
    <div class="state-label">RBAC Enforcement</div>
    <h1>Access denied</h1>
    <p>
      Your active tenant membership does not include the permission required for this route.
    </p>
    <p *ngIf="permission" class="permission-chip" data-testid="auth-access-denied-permission">
      Required permission: <strong>{{ permission }}</strong>
    </p>

    <div class="actions" data-testid="auth-access-denied-actions">
      <button mat-flat-button color="primary" (click)="goBack()" data-testid="auth-access-denied-return">Return</button>
      <a mat-stroked-button routerLink="/workspace" data-testid="auth-access-denied-workspace-link">Workspace</a>
    </div>
  </mat-card>
</section>
