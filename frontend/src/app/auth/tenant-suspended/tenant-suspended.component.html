<section class="state-page">
  <mat-card>
    <div class="state-label">Tenant Status Enforcement</div>
    <h1>Tenant access is suspended</h1>
    <p>
      The active tenant is currently suspended, so protected workflows are blocked.
    </p>

    <div class="tenant-box" *ngIf="session?.activeTenant as activeTenant">
      <strong>{{ activeTenant.tenantName }}</strong>
      <span>Status: {{ activeTenant.tenantStatus }}</span>
    </div>

    <div *ngIf="session?.memberships?.length" class="tenant-list">
      <h2>Switch to another tenant</h2>
      <button
        *ngFor="let membership of session?.memberships"
        mat-stroked-button
        color="primary"
        [disabled]="membership.tenantId === session?.activeTenant?.tenantId"
        (click)="switchTenant(membership.tenantId)">
        <span>{{ membership.tenantName }}</span>
        <small>{{ membership.tenantStatus }} | {{ membership.roles.join(', ') }}</small>
      </button>
    </div>

    <div class="actions">
      <button mat-flat-button color="warn" (click)="logout()">Sign out</button>
    </div>
  </mat-card>
</section>
